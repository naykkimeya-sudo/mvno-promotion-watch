name: 접근 진단

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 여러 방식으로 접근 시도
        run: |
          UA_BROWSER='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'
          probe () {
            echo "--- $1"
            shift
            code=$(curl -s -o /tmp/body.txt -w '%{http_code}' "$@")
            echo "HTTP $code / $(wc -c < /tmp/body.txt) bytes"
            head -c 200 /tmp/body.txt; echo; echo
          }

          probe "A: 기본 curl (API)" https://mvno-promotion.hinori.mmv.kr/api/data

          probe "B: 브라우저 UA (API)" \
            -H "User-Agent: $UA_BROWSER" \
            https://mvno-promotion.hinori.mmv.kr/api/data

          probe "C: 브라우저 UA + 전체 헤더 (API)" \
            -H "User-Agent: $UA_BROWSER" \
            -H 'Accept: application/json, text/plain, */*' \
            -H 'Accept-Language: ko-KR,ko;q=0.9,en-US;q=0.8' \
            -H 'Referer: https://mvno-promotion.hinori.mmv.kr/' \
            -H 'Sec-Fetch-Dest: empty' -H 'Sec-Fetch-Mode: cors' -H 'Sec-Fetch-Site: same-origin' \
            --compressed \
            https://mvno-promotion.hinori.mmv.kr/api/data

          probe "D: 브라우저 UA (HTML 페이지)" \
            -H "User-Agent: $UA_BROWSER" \
            -H 'Accept: text/html,application/xhtml+xml' \
            --compressed \
            https://mvno-promotion.hinori.mmv.kr/

          echo "--- 러너 IP 정보"
          curl -s https://ipinfo.io/json | head -c 300
